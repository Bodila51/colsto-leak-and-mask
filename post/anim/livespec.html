<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>live spectrogram</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#05070a;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Live scrolling spectrogram of a clip's own audio with the predicted Doppler curve over it: window.renderAt(t), t in clip s.
   Everything comes from build/livespec.json and its PNG (post/anim/midway_triptych.py). Only the part of the spectrogram
   that has already been heard is drawn; the predicted curve runs ahead of it.
   ?layout=panel (960x540) | panelv (1080x500). No requestAnimationFrame, no Date, no Math.random. */
"use strict";
const Q = new URLSearchParams(location.search);
const LAYOUT = Q.get('layout') === 'panelv' ? 'panelv' : 'panel';
const DUR = 20, VIEW = 8, PH = 0.72;     // seconds visible, playhead position once it scrolls
const C = { bg: '#05070a', panel: '#080c11', line: 'rgba(255,255,255,0.11)', text: '#f3f6f9', dim: 'rgba(243,246,249,0.62)',
  dimmer: 'rgba(243,246,249,0.38)', cyan: '#19e3ff', amber: '#f5b84a' };
const SANS = "'Inter','Segoe UI',system-ui,sans-serif";
const MONO = "'JetBrains Mono','Cascadia Mono',Consolas,monospace";
const L = {
  panel: { W: 960, H: 540, pad: 22, stepY: 28, stepSz: 13, headY: 58, headSz: 26, spec: { x: 66, y: 82, w: 872, h: 350 },
    axis: 12, lab: 15, badge: 12, creditY: 528, creditSz: 12, lw: 2 },
  panelv: { W: 1080, H: 500, pad: 22, stepY: 26, stepSz: 13, headY: 56, headSz: 26, spec: { x: 70, y: 78, w: 988, h: 320 },
    axis: 12, lab: 16, badge: 12, creditY: 490, creditSz: 12, lw: 2 }
}[LAYOUT];
const cv = document.getElementById('c');
cv.width = L.W; cv.height = L.H;
const ctx = cv.getContext('2d');
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, a, b) => cl((t - a) / (b - a));
function text(s, x, y, o = {}) {
  ctx.save(); ctx.font = `${o.weight || 500} ${o.size || 14}px ${o.mono ? MONO : SANS}`;
  ctx.textAlign = o.align || 'left'; ctx.globalAlpha = (o.alpha ?? 1) * ctx.globalAlpha;
  if (o.track) ctx.letterSpacing = o.track + 'px';
  ctx.fillStyle = o.color || C.text; ctx.fillText(s, x, y); const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function measure(s, o = {}) { ctx.save(); ctx.font = `${o.weight || 500} ${o.size || 14}px ${o.mono ? MONO : SANS}`; const w = ctx.measureText(s).width; ctx.restore(); return w; }
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

let D, IMG;
window.ready = (async () => {
  const font = (fam, url) => new FontFace(fam, `url(${url})`, { weight: '100 900' }).load().then(f => document.fonts.add(f));
  await Promise.all([font('Inter', 'fonts/Inter-var.woff2'), font('JetBrains Mono', 'fonts/JetBrainsMono-var.woff2')]);
  D = await fetch('build/livespec.json').then(r => r.json());
  IMG = await new Promise((res, rej) => { const i = new Image(); i.onload = () => i.decode().then(() => res(i)); i.onerror = rej; i.src = D.spec; });
  window.__ok = true;
})();

function view(t) {                    // [v0, v1]: the playhead walks in, then the picture scrolls under it
  const v0 = Math.max(0, t - VIEW * PH);
  return [v0, v0 + VIEW];
}

function drawSpec(t) {
  const R = L.spec, M = D.meta, [v0, v1] = view(t);
  const xOf = s => R.x + (s - v0) / (v1 - v0) * R.w, yOf = f => R.y + R.h * (1 - (f - M.f_min_hz) / (M.f_max_hz - M.f_min_hz));
  rrect(R.x, R.y, R.w, R.h, 8); ctx.fillStyle = C.panel; ctx.fill();
  ctx.save(); rrect(R.x, R.y, R.w, R.h, 8); ctx.clip();
  // heard so far: columns up to the playhead
  const xph = xOf(t), c0 = Math.max(0, v0), c1 = Math.min(t, DUR);
  if (c1 > c0) {
    const sx = c0 / M.hop_s, sw = (c1 - c0) / M.hop_s;
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(IMG, sx, 0, Math.min(IMG.width - sx, sw), IMG.height, xOf(c0), R.y, xOf(c1) - xOf(c0), R.h);
  }
  // kHz gridlines
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  for (let f = 1000; f < M.f_max_hz; f += 1000) ctx.fillRect(R.x, Math.round(yOf(f)), R.w, 1);
  // closest approach marker
  if (D.cpa_t >= v0 && D.cpa_t <= v1) {
    const x = xOf(D.cpa_t); ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.setLineDash([4, 5]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, R.y); ctx.lineTo(x, R.y + R.h); ctx.stroke(); ctx.setLineDash([]);
    text('closest approach', x + 6, R.y + R.h - 10, { size: L.axis, mono: true, color: C.dim });
  }
  // predicted curves: bright where already heard, dim ahead of the playhead
  const ca = ramp(t, 0.6, 1.4);
  for (const c of D.curves) {
    for (const [a, b, al] of [[v0, Math.min(t, v1), 1], [t, v1, 0.45]]) {
      if (b <= a) continue;
      ctx.save(); ctx.globalAlpha = ca * al; ctx.strokeStyle = C.cyan; ctx.lineWidth = L.lw; ctx.setLineDash([L.lw * 3.4, L.lw * 2.6]);
      ctx.shadowColor = 'rgba(25,227,255,0.7)'; ctx.shadowBlur = 6; ctx.beginPath(); let first = true;
      for (let i = 0; i < c.t_s.length; i++) {
        const s = c.t_s[i]; if (s < a || s > b) continue;
        const f = c.f_hz[i]; if (f < M.f_min_hz || f > M.f_max_hz) { first = true; continue; }
        const x = xOf(s), y = yOf(f); if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
      }
      ctx.stroke(); ctx.restore();
    }
    // harmonic tag at the right edge
    const i = c.t_s.findIndex(s => s >= v1 - 0.25), f = c.f_hz[i < 0 ? c.f_hz.length - 1 : i];
    if (f > M.f_min_hz && f < M.f_max_hz) text(c.harmonic + '×', R.x + R.w - 8, yOf(f) - 6, { size: L.axis, mono: true, color: C.cyan, align: 'right', alpha: ca * .9 });
  }
  ctx.restore();
  rrect(R.x + .5, R.y + .5, R.w - 1, R.h - 1, 8); ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.stroke();
  // playhead
  ctx.save(); ctx.shadowColor = 'rgba(255,255,255,0.5)'; ctx.shadowBlur = 10; ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fillRect(xph - 1.5, R.y - 3, 3, R.h + 6); ctx.restore();
  // axes
  for (let f = 1000; f < M.f_max_hz; f += 1000) text(f === 7000 ? '7 kHz' : (f / 1000) + 'k', R.x - 10, yOf(f) + 4, { size: L.axis, mono: true, color: C.dimmer, align: 'right' });
  for (let s = Math.ceil(v0); s <= v1; s++) {
    const x = xOf(s); if (x < R.x + 8 || x > R.x + R.w - 8) continue;
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(x, R.y + R.h, 1, 6);
    text(s + ' s', x, R.y + R.h + 8 + L.axis, { size: L.axis, mono: true, color: C.dimmer, align: 'center' });
  }
  // label: what the cyan lines are
  const la = ramp(t, 1.0, 1.5), lw = measure(D.label, { size: L.lab, weight: 600 }) + 24;
  ctx.save(); ctx.globalAlpha = la; rrect(R.x + 12, R.y + 12, lw, L.lab + 18, 7); ctx.fillStyle = 'rgba(5,7,10,0.86)'; ctx.fill();
  ctx.strokeStyle = 'rgba(25,227,255,0.6)'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
  text(D.label, R.x + 24, R.y + 12 + L.lab + 4, { size: L.lab, weight: 600, color: C.cyan, alpha: la });
}

window.renderAt = function (t) {
  t = cl(t, 0, DUR - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.setLineDash([]);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, L.W, L.H);
  text(D.step, L.pad, L.stepY, { size: L.stepSz, mono: true, color: C.cyan, track: 1.5 });
  text(D.title, L.pad, L.headY, { size: L.headSz, weight: 700 });
  text('t = ' + t.toFixed(1).padStart(4, '0') + ' s', L.W - L.pad, L.stepY, { size: L.stepSz, mono: true, color: C.dim, align: 'right' });
  drawSpec(t);
  // badge: not a blind result
  const R = L.spec, by = R.y + R.h + L.axis + 22, bw = measure(D.badge, { size: L.badge, mono: true, weight: 600 }) + 20;
  rrect(L.pad, by, bw, L.badge + 12, 6); ctx.fillStyle = 'rgba(245,184,74,0.12)'; ctx.fill();
  ctx.strokeStyle = 'rgba(245,184,74,0.7)'; ctx.lineWidth = 1; ctx.stroke();
  text(D.badge, L.pad + 10, by + L.badge + 3, { size: L.badge, mono: true, weight: 600, color: C.amber });
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(L.pad, L.creditY - L.creditSz - 9, L.W - 2 * L.pad, 1);
  text(D.credits, L.pad, L.creditY, { size: L.creditSz, mono: true, color: C.dimmer });
};
</script>
</body>
</html>
